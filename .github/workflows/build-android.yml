name: Build Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL de l'API de production
        required: true
        default: https://api.exemple.invalid
  push:
    tags: ['v*']

jobs:
  appbundle:
    name: App bundle release
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restaurer le keystore (si configuré)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build appbundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || vars.API_BASE_URL || 'https://api.exemple.invalid' }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || '' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: lotolab-ia-appbundle
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14
