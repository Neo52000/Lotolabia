name: Build Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL de l'API (laisser vide si aucune API n'est hébergée — l'appli lit alors Supabase en direct)
        required: false
        default: ''
  push:
    tags: ['v*']

# Valeurs par défaut du projet Supabase lotolab-ia, utilisées si les variables
# de dépôt SUPABASE_URL / SUPABASE_ANON_KEY ne sont pas définies. La clé « anon »
# est publique par conception (elle est embarquée dans l'appli et dans le site) :
# la sécurité repose sur la RLS (lecture seule publique sur `draws`).
env:
  DEFAULT_SUPABASE_URL: https://kasapoqvsravyuejjjdq.supabase.co
  DEFAULT_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imthc2Fwb3F2c3Jhdnl1ZWpqamRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDYwODYsImV4cCI6MjA5OTYyMjA4Nn0.z48m8DGwSab7mvV22MSQm6XtZF548sRTMKj5MNLxqEs

jobs:
  appbundle:
    name: App bundle release
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    # Le contexte `secrets` est interdit dans un `if:` d'étape (fichier de
    # workflow rejeté par GitHub) : on passe par `env`, qui y est autorisé.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restaurer le keystore (si configuré)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build appbundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || vars.API_BASE_URL || '' }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: lotolab-ia-appbundle
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14

  apk:
    name: APK de test (installable directement)
    # Déclenché uniquement à la demande : le .apk sert à tester sur un
    # téléphone sans passer par le Play Store, contrairement au .aab
    # (job ci-dessus) qui est le format attendu à la publication.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    # Le contexte `secrets` est interdit dans un `if:` d'étape (fichier de
    # workflow rejeté par GitHub) : on passe par `env`, qui y est autorisé.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restaurer le keystore (si configuré)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build apk
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || vars.API_BASE_URL || '' }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || env.DEFAULT_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || env.DEFAULT_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: lotolab-ia-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
