name: Synchronisation planifiée des tirages

# Déclenche POST /api/v1/cron/sync sur l'API de production. Solution retenue
# pour rester compatible avec le scale-to-zero de fly.toml (min_machines_running
# = 0) : contrairement au planificateur interne (APScheduler, SCHEDULER_ENABLED),
# ce workflow ne dépend d'aucune instance déjà en cours d'exécution — l'appel
# HTTP réveille la machine Fly à la demande.
#
# Deux horaires par créneau (été/hiver) car les cron GitHub Actions sont fixés
# en UTC, sans awareness de fuseau ni changement d'heure. L'appel « en trop »
# est sans risque : la synchronisation est idempotente (dédoublonnage sur
# draw_date + draw_type) et le contrôle du lendemain rattrape tout retard.
#
# Prérequis (Settings → Secrets and variables → Actions) :
#   - Variable COLLECTOR_API_BASE_URL (ex. https://lotolabia.fly.dev)
#   - Secret   COLLECTOR_CRON_SECRET (même valeur que COLLECTOR_CRON_SECRET
#              défini côté API via `fly secrets set`)

on:
  schedule:
    # Lundi, mercredi, samedi 22 h 30 Paris (CEST puis CET)
    - cron: '30 20 * * 1,3,6'
    - cron: '30 21 * * 1,3,6'
    # Mardi, jeudi, dimanche 12 h 00 Paris (contrôle du lendemain)
    - cron: '0 10 * * 0,2,4'
    - cron: '0 11 * * 0,2,4'
  workflow_dispatch: {}

jobs:
  sync:
    name: Déclencher la synchronisation
    runs-on: ubuntu-latest
    steps:
      - name: Appeler POST /api/v1/cron/sync
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::COLLECTOR_API_BASE_URL ou COLLECTOR_CRON_SECRET non configuré — voir le commentaire en tête de ce workflow."
            exit 1
          fi
          curl --fail --show-error --silent \
            --max-time 60 \
            -X POST "$API_BASE_URL/api/v1/cron/sync" \
            -H "X-Cron-Secret: $CRON_SECRET"
        env:
          API_BASE_URL: ${{ vars.COLLECTOR_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.COLLECTOR_CRON_SECRET }}
