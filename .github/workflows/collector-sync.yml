name: Synchronisation planifiée des tirages

# Exécute directement backend/scripts/run_scheduled_sync.py dans ce runner,
# contre Supabase (clé service role) : CollectorService ne dépend pas du
# serveur FastAPI, donc aucune API hébergée en continu n'est nécessaire
# (pas de Fly.io, pas de SCHEDULER_ENABLED, pas de secret cron HTTP).
#
# Deux horaires par créneau (été/hiver) car les cron GitHub Actions sont fixés
# en UTC, sans awareness de fuseau ni changement d'heure. L'appel « en trop »
# est sans risque : la synchronisation est idempotente (dédoublonnage sur
# draw_date + draw_type) et le contrôle du lendemain rattrape tout retard.
#
# Prérequis (Settings → Secrets and variables → Actions → Secrets) :
#   - SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - COLLECTOR_HISTORY_URLS (URLs réelles des fichiers officiels — voir
#     docs/IMPORT_AUTOMATIQUE.md)

on:
  schedule:
    # Lundi, mercredi, samedi 22 h 30 Paris (CEST puis CET)
    - cron: '30 20 * * 1,3,6'
    - cron: '30 21 * * 1,3,6'
    # Mardi, jeudi, dimanche 12 h 00 Paris (contrôle du lendemain)
    - cron: '0 10 * * 0,2,4'
    - cron: '0 11 * * 0,2,4'
  workflow_dispatch: {}

jobs:
  sync:
    name: Exécuter la synchronisation
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    # Au niveau du job : l'étape de vérification doit voir les mêmes variables
    # que le script, sinon elle échoue même avec les secrets configurés.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_HISTORY_URLS: ${{ secrets.COLLECTOR_HISTORY_URLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Vérifier la configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL ou SUPABASE_SERVICE_ROLE_KEY non configuré — voir le commentaire en tête de ce workflow."
            exit 1
          fi

      - name: Synchroniser les tirages
        run: python scripts/run_scheduled_sync.py
