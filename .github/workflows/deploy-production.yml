name: Déploiement production (web)

# Déclenchement manuel uniquement. L'environnement GitHub « production » doit être
# configuré avec des relecteurs requis (Settings → Environments → production →
# Required reviewers) : le job reste en attente tant qu'un humain n'a pas approuvé.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  netlify-production:
    name: Netlify — production (validation manuelle requise)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PROD_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Déployer sur Netlify (production)
        run: |
          npx netlify-cli deploy --dir .next --build=false --prod \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "production ${GITHUB_SHA::8}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_PROD }}
