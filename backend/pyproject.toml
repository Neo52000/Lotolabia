[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008 : pattern officiel FastAPI (Depends en défaut)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
